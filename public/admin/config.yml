backend:
  name: git-gateway
  branch: main

# Local development backend support (npx decap-server)
local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "promo"
    label: "Paket Promo MUA & Dekorasi"
    folder: "src/content/promo"
    create: true
    format: "json"
    fields:
      - { label: "Judul Paket", name: "title", widget: "string" }
      - { label: "Badge Promo", name: "badge", widget: "string" }
      - { label: "Subjudul", name: "subtitle", widget: "string" }
      - { label: "Harga Normal", name: "originalPrice", widget: "string" }
      - { label: "Harga Promo", name: "promoPrice", widget: "string" }
      - { label: "Tag Diskon", name: "discountTag", widget: "string" }
      - { label: "Masa Berlaku", name: "validUntil", widget: "string" }
      - { label: "Sisa Kuota", name: "slotsLeft", widget: "number", value_type: "int" }
      - { label: "Fitur / Layanan", name: "features", widget: "list" }
      - { label: "Bonus Tambahan", name: "bonuses", widget: "list" }
      - { label: "Teks Tombol CTA", name: "ctaText", widget: "string" }

  - name: "gallery"
    label: "Galeri Karya (MUA & Dekorasi)"
    folder: "src/content/gallery"
    create: true
    format: "json"
    fields:
      - { label: "Judul Karya", name: "title", widget: "string" }
      - { label: "Kategori", name: "category", widget: "select", options: ["Bridal Makeup", "Wedding Decoration"] }
      - { label: "URL Gambar", name: "imageUrl", widget: "image" }
      - { label: "Teks Alt", name: "alt", widget: "string" }
      - { label: "Orientasi", name: "aspectRatio", widget: "select", options: ["portrait", "landscape", "square"] }
      - { label: "Kisah / Story Snippet", name: "storySnippet", widget: "text" }
      - { label: "Urutan", name: "order", widget: "number", default: 1 }

  - name: "moments"
    label: "Artikel & Cerita Inspirasi (SEO)"
    folder: "src/content/moments"
    create: true
    format: "yaml-frontmatter"
    extension: "md"
    fields:
      - { label: "Judul Artikel", name: "title", widget: "string" }
      - { label: "Subjudul", name: "subtitle", widget: "string" }
      - { label: "Target Kata Kunci (SEO Keywords)", name: "seoKeywords", widget: "list" }
      - { label: "Meta Description", name: "metaDescription", widget: "text" }
      - { label: "Tanggal Publikasi", name: "publishDate", widget: "date" }
      - { label: "Estimasi Waktu Baca", name: "readTime", widget: "string" }
      - { label: "Kategori", name: "category", widget: "string" }
      - { label: "Lokasi", name: "location", widget: "string" }
      - { label: "Gambar Utama", name: "featuredImage", widget: "image" }
      - { label: "Alt Teks Gambar", name: "imageAlt", widget: "string" }
      - { label: "Highlight Poin", name: "highlights", widget: "list" }
      - { label: "Isi Narasi Artikel", name: "body", widget: "markdown" }
